name: Development tag check

on:
  push:
    tags:
      - 'v*-dev'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing development tag to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify source-only development tag
    runs-on: ubuntu-latest
    steps:
      - name: Select tag
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$PUSH_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev$ ]]; then
            echo "Expected a development tag like v0.9.0-dev; got: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out development source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Confirm source checkpoint
        shell: bash
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          test -f src/RCLootCouncil_dibs.toc
          echo "Validated source checkpoint $TAG at $(git rev-parse HEAD)."
          echo "No package or GitHub Release is created for -dev tags."
